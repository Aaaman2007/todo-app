<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Page not found</title>
  <style>
    :root {
      --bg: #f5f6fb; --card: #fff; --ink: #15171d; --muted: #6b7280;
      --line: #e6e8f0; --accent: #4f46e5; --accent-2: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e1015; --card: #171a21; --ink: #e9ebf2; --muted: #98a1b2;
              --line: #262b37; --accent: #818cf8; --accent-2: #a78bfa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); background: var(--bg);
    }
    main {
      max-width: 420px; width: 100%; text-align: center; padding: 40px 28px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 16px 40px -20px rgba(16, 24, 40, .3);
    }
    .code {
      margin: 0; font-size: 56px; font-weight: 800; letter-spacing: -.04em; line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 10px 0 6px; font-size: 19px; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 10px; font-weight: 650;
      color: #fff; text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the task you're looking for was already removed.</p>
    <a href="{{ url_for('home') }}">Back to my tasks</a>
  </main>
</body>
</html>
