<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 12px; }
    input { padding: 8px; width: 65%; }
    button { padding: 8px 12px; }
    li { display: flex; justify-content: space-between; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>My To-Do List</h2>
  <form action="/add" method="post">
    <input name="title" placeholder="New task" required>
    <button>Add</button>
  </form>
  <ul style="padding:0; list-style:none;">
    {% for t in tasks %}
    <li>{{ t }}
      <form action="/delete/{{ loop.index0 }}" method="post">
        <button>Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>
</body>
</html>
